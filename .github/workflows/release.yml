name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，如 0.1.0）'
        required: true
        type: string
      publish_npm:
        description: '是否把扩展发到 npm（需要 NPM_TOKEN secret；第一版手动发可关闭）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write  # npm Trusted Publishing 需要 OIDC token

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 把插件包版本同步到本次发布版本——postinstall 用 package.json.version 拼
      # release asset 下载 URL，不一致会导致装包时 404。提交并推，让 gh release
      # 创建的 tag 指向已 bump 的 commit。
      - name: Bump plugin version
        shell: bash
        run: |
          cd extensions/pi
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          git add package.json
          git commit -m "chore(release): bump plugin version to ${{ inputs.version }}" || true
          git push origin HEAD:${{ github.ref_name }}
      # 构建成带平台名的文件，资产名=文件名；解压/重命名为 codesafe 由用户完成
      - name: Build all platforms
        run: |
          go build -ldflags="-s -w" -o out/codesafe-windows-amd64.exe ./cmd/codesafe
          $env:GOOS="linux";  $env:GOARCH="amd64"; go build -ldflags="-s -w" -o out/codesafe-linux-amd64  ./cmd/codesafe
          $env:GOOS="darwin"; $env:GOARCH="arm64"; go build -ldflags="-s -w" -o out/codesafe-darwin-arm64 ./cmd/codesafe
          $env:GOOS="darwin"; $env:GOARCH="amd64"; go build -ldflags="-s -w" -o out/codesafe-darwin-amd64 ./cmd/codesafe
          Remove-Item Env:GOOS, Env:GOARCH

      - name: Compute changelog range
        id: range
        shell: bash
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v "^v${{ inputs.version }}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            echo "range=$PREV...v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            FIRST=$(git rev-list --max-parents=0 HEAD | head -1)
            echo "range=$FIRST...v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          RANGE="${{ steps.range.outputs.range }}"
          V="${{ inputs.version }}"
          cat > notes.md <<EOF
          ## 下载

          | 平台 | 文件 |
          |---|---|
          | Windows (x64) | \`codesafe-windows-amd64.exe\` |
          | Linux (x64) | \`codesafe-linux-amd64\` |
          | macOS (Apple Silicon) | \`codesafe-darwin-arm64\` |
          | macOS (Intel) | \`codesafe-darwin-amd64\` |

          下载后重命名为 \`codesafe\`（Windows 为 \`codesafe.exe\`）并放入 PATH 即可使用。

          ## 变更

          [完整变更记录](https://github.com/${REPO}/compare/${RANGE})
          EOF
          gh release create "v${V}" --title "v${V}" --notes-file notes.md
          gh release upload "v${V}" --clobber \
            out/codesafe-windows-amd64.exe \
            out/codesafe-linux-amd64 \
            out/codesafe-darwin-arm64 \
            out/codesafe-darwin-amd64

      # 插件发到 npm：走 Trusted Publishing（OIDC，无 token）。必须先于本步发好
      # release（postinstall 按 package.json.version 从本仓库 releases 下载 CLI）。
      # 仅在 publish_npm=true 时运行。npm ≥11.5.1 才支持 trusted publishing，
      # setup-node 自带的版本可能旧，先升级 npm。
      - name: Setup node for npm publish
        if: ${{ inputs.publish_npm }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        if: ${{ inputs.publish_npm }}
        run: npm install -g npm@latest
      - name: npm publish
        if: ${{ inputs.publish_npm }}
        working-directory: extensions/pi
        run: npm publish --access public
